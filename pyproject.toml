[project]
name = "knot-ai"
version = "0.1.0"
description = "Python agent framework: filesystem-authored agents, durable sessions, human-in-the-loop, MCP connections"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "httpx",
    "pyyaml",
    "mcp",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
litellm = ["litellm"]

[project.scripts]
knot = "knot.server.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
